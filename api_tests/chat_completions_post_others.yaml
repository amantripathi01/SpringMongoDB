config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 5
  plugins:
    expect: {}
  payload:
    path: "chat_completions_post_others.csv"
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: Non-Success API Responses for Chat Completion
    flow:
      - log: "Testing with invalid model name"
      - post:
          url: "/chat/completions"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          payload:
            model: "invalid-model"
            messages:
              - role: "user"
                content: "Hello, how are you?"
            temperature: 1
            max_tokens: 100
      - expect:
          - statusCode: 400
          - contentType: "application/json"
          - hasProperty: "error"
          - jmespath: { expression: "error.message", equals: "Invalid model name." }
      - think: 5

      - log: "Testing with missing required 'model' parameter"
      - post:
          url: "/chat/completions"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          payload:
            messages:
              - role: "user"
                content: "Hello, how are you?"
      - expect:
          - statusCode: 400
          - contentType: "application/json"
          - hasProperty: "error"
          - jmespath: { expression: "error.message", equals: "'model' is a required property." }
      - think: 5

